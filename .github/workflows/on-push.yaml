name: On Code Push
on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'fix/*'
      - 'copilot/*'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firefly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firefly/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Build application
        run: npm run build

  test:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: firefly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firefly/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

  acceptance:
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    defaults:
      run:
        working-directory: firefly
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firefly/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Execute acceptance specifications
        run: npm run acceptance