name: Release

on:
  push:
    branches: [ main ]

jobs:
  release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package application
        run: npm run package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firefly-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
          if-no-files-found: ignore

  create-release:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.exe
          body: |
            ## Firefly v${{ steps.version.outputs.version }}
            
            Coast FIRE Planning Application
            
            ### Downloads
            - **macOS**: Download the .dmg file
            - **Linux**: Download the .AppImage file
            - **Windows**: Download the .exe file
            
            ### Features
            - Feature v1-001: Configure Coast FIRE plan phases
            - Load and save Coast FIRE plans
            - Adjust phase boundaries dynamically
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
